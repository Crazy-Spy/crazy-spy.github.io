<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crazy Spy Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            color: #9ca3af;
            margin-top: 0;
        }

        .apps {
            margin-top: 50px;
            text-align: left;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            background: #293548;
        }

        .card h3 {
            margin-top: 0;
        }

        a {
            color: #4fc3f7;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;
            color: #777;
            font-size: .9em;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 Crazy Spy Studios</h1>

    <div class="apps">

        <div class="card">

            <p>
                Restore the electrical network by rotating the power lines.
